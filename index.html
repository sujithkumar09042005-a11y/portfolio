<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d1030'/%3E%3Cpath d='M8 44c10-26 20-26 24-8s14 14 24-12' fill='none' stroke='%23a99bff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sujith Kumar V - Full-Stack Developer">
  <meta property="og:description" content="Java, Spring Boot and React applications, built with care for speed and accessibility.">
  <meta name="twitter:card" content="summary">
  <title>Sujith Kumar V - Full-Stack Developer</title>
  <meta name="description" content="Portfolio of Sujith Kumar V, a full-stack developer building Java, Spring Boot and React applications.">
  <meta name="color-scheme" content="dark light">
  <script>
    // Set theme before first paint to avoid a flash
    (function () {
      var saved = localStorage.getItem("theme");
      var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.dataset.theme = saved || (prefersLight ? "light" : "dark");
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
